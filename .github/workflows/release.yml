name: Release Weather CLI

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read package version
        id: package
        shell: bash
        run: echo "version=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')" >> "$GITHUB_OUTPUT"

      - name: Check tag does not exist
        env:
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "The tag ${TAG} already exists. Increase package.json version before releasing."
            exit 1
          fi

      - name: Build release binary
        run: bun run build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: gh release create "v${VERSION}" weather.exe --title "Weather CLI v${VERSION}" --generate-notes
